<!DOCTYPE html>
<html lang="it">
<head>

<style>
:root{--bg:#F4F2FA;--card:#fff;--ink:#17152B;--mut:#6A6783;--line:#E0DCF0;--acc:#6D4CE0;--on:#fff;--ok:#2E9E5B;--warn:#D9811A;--blue:#3B82F6;--red:#D6264F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12101F;--card:#1E1D2B;--ink:#F1EFFA;--mut:#A6A3C0;--line:#2D2B42;--acc:#A78BFA;--on:#12101F;--ok:#6FD38B;--warn:#F2A64A;--blue:#6AA7FF;--red:#FF6B8A}}
:root[data-theme="dark"]{--bg:#12101F;--card:#1E1D2B;--ink:#F1EFFA;--mut:#A6A3C0;--line:#2D2B42;--acc:#A78BFA;--on:#12101F;--ok:#6FD38B;--warn:#F2A64A;--blue:#6AA7FF;--red:#FF6B8A}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px}
.pill{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px 18px;font-weight:700;font-size:20px}
h2{font-size:22px;margin:22px 0 10px}h3{font-size:17px;margin:16px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px}
.card p{margin:6px 0}.mut{color:var(--mut);font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
button,select,input,textarea{font:inherit;color:var(--ink)}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:14px;min-height:46px;padding:10px 18px;font-weight:700;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.5}
.item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:8px;min-height:56px;cursor:pointer}
.item.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}.item.done b{text-decoration:line-through;opacity:.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld{display:block}.fld span{display:block;font-size:13px;color:var(--mut);margin-bottom:3px}
.fld input,.fld select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
textarea{min-height:96px;resize:vertical}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}
.rg b{display:block;font-size:13px}.rg span{font-size:12px;color:var(--mut)}
.blk{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.blk:first-of-type{border-top:0}.blk i{font-style:normal;font-weight:800;font-size:22px;color:var(--acc)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;min-height:48px;background:none;border:0;border-radius:12px;color:var(--mut);font-size:13px;font-weight:600;cursor:pointer}
.tabs button[aria-current="page"]{color:var(--acc);background:var(--bg)}
.tabs button span{display:block;font-size:20px;line-height:1.1}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar div{height:100%;background:var(--ok)}
.doc h3{margin-top:18px}.doc ul{padding-left:20px}.doc li{margin:4px 0}
.err{color:var(--red);font-size:14px;margin:8px 0}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:8px 0}.seg button{flex:1;min-height:40px;border:0;border-radius:10px;background:none;font-weight:600;color:var(--mut);cursor:pointer}.seg button[aria-pressed="true"]{background:var(--acc);color:var(--on)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal button,.cal span{min-height:46px;border:0;border-radius:12px;background:none;color:var(--ink);font-size:15px}.cal button{cursor:pointer}.cal button[aria-pressed="true"]{background:var(--acc);color:var(--on)}
.msg{max-width:88%;padding:10px 14px;border-radius:16px;margin:8px 0}.msg p{margin:4px 0}.msg.u{background:var(--acc);color:var(--on);margin-left:auto}.msg.a{background:var(--card);border:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0}.tb{width:100%;border-collapse:collapse;font-size:14px}.tb td,.tb th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}
.fbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.fbs .btn{padding:8px 4px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>

<body>
<main id="app" class="wrap"></main>
<nav class="tabs" id="tabs" aria-label="Sezioni">
<button data-t="oggi"><span>◉</span>Oggi</button><button data-t="coach"><span>✦</span>Allenatore</button><button data-t="piano"><span>▤</span>Piano</button><button data-t="set"><span>⚙</span>Impostazioni</button>
</nav>
<script>
const $=id=>document.getElementById(id);
const ls={g(k,d){try{const v=localStorage.getItem('ac:'+k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem('ac:'+k,JSON.stringify(v))}catch(e){}}};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'],GG=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
const fd=s=>{const d=new Date(s+'T12:00');return GG[d.getDay()]+' '+d.getDate()+' '+MESI[d.getMonth()]};
const TN={riposo:'Riposo / facile',allenamento:'Allenamento',lungo:'Lungo',mantenimento:'Mantenimento'};
const TD={riposo:[2150,145,240,70],allenamento:[2450,145,330,70],lungo:[2750,145,450,70],mantenimento:[2600,145,335,75]};
const DEF='3 pasti + 2 spuntini, proteine a ogni pasto (uova o skyr a colazione, pesce o carne magra a pranzo e cena, parmigiano), carboidrati concentrati attorno agli allenamenti, nessuna restrizione alimentare, sabato un pasto libero.';

const addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const dow=s=>(new Date(s+'T12:00').getDay()+6)%7;
const monOf=s=>addD(s,-dow(s));
const diff=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const T=iso(new Date());
let tab='oggi',sub='cal',cv='w',off=0,moff=0,sel=T,det=null,exp=null,SM=null,busy='',streamTxt='',rst=false,DM={},PLN=[];
const pace=x=>{x=Math.round(x);return Math.floor(x/60)+':'+String(x%60).padStart(2,'0')};
const hms=x=>{x=Math.round(x);const h=Math.floor(x/3600),m=Math.floor(x%3600/60),s=x%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')};
const pt=s=>{const p=String(s).trim().split(':').map(Number);if(!p.length||p.some(isNaN))return 0;return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0]*60};
const DS={gelN:'Enervit Liquid Gel',gelC:30,supN:'Optimum Nutrition Gold Standard Whey',supP:24,supK:120,supC:3,supG:1,vol:55,days:4,rd:21.0975,rt:6050,int:'Moderata',len:'Breve',kgT:'',rate:0.4};
const SET=()=>Object.assign({},DS,ls.g('set',{}));
function zones(){const s=SET(),p10=s.rt*Math.pow(10/s.rd,1.06)/10;return{e:[p10*1.22,p10*1.36],l:[p10*1.25,p10*1.4],t:p10*1.06,i:p10*.97}}
const G={0:{n:'Blocco di base',km:10,cap:55,pl:16,tp:[]},5:{n:'5 km',km:5,cap:45,pl:10,tp:[.65]},10:{n:'10 km',km:10,cap:55,pl:14,tp:[.65]},21:{n:'Mezza maratona',km:21.0975,cap:65,pl:20,tp:[.75,.55]},42:{n:'Maratona',km:42.195,cap:80,pl:32,tp:[.8,.6,.4]}};
const gtime=g=>{const s=SET();return Math.round(s.rt*Math.pow(G[g].km/s.rd,1.06)/10)*10};
const TPL={3:[[2,'Q1'],[4,'E'],[6,'L']],4:[[0,'E'],[2,'Q1'],[4,'E'],[6,'L']],5:[[0,'E'],[1,'Q1'],[3,'E'],[4,'Q2'],[6,'L']]};
const REC=[['2026-10-12','R','Riposo',0,'Il giorno dopo la gara: camminata leggera e mobilità.'],['2026-10-13','R','Riposo',0,'Dormi bene.'],['2026-10-14','E','Facile 35–40′',6,'Molto facile, conversazione piena.'],['2026-10-15','R','Riposo',0,'Mobilità leggera se ti va.'],['2026-10-16','E','Facile con allunghi',7,'5–6 km facili e 4 allunghi da 20″.'],['2026-10-17','R','Riposo',0,'Niente corsa.'],['2026-10-18','L','Lungo facile',11,'10–12 km a ritmo costante, senza cronometro.']];
function recDay(r){const z=zones(),e=pace(z.e[0])+'–'+pace(z.e[1])+'/km';return{d:r[0],t:r[1],n:r[2],km:r[3],no:r[4],bl:[[r[2],r[4],r[3]?e:'']]}}
function mk(t,km,c){const{z,gp,p,g}=c,e=pace(z.e[0])+'–'+pace(z.e[1])+'/km',k0=Math.round(km);
 if(t==='G')return{t,n:'Gara: '+g.n,km:g.km,bl:[['Riscaldamento','10–15′ facili con 3 allunghi',e],['Gara',g.n+' a ritmo costante',pace(gp)+'/km']],no:"Parti controllato e accelera solo nell'ultimo terzo."};
 if(t==='W')return{t:'E',n:'Facile con allunghi',km:k0,bl:[['Corsa facile',k0+' km con 4 allunghi da 20″',e]],no:'Gambe sciolte, niente fatica.'};
 if(t==='E')return{t,n:'Facile '+k0+' km',km:k0,bl:[['Corsa facile',k0+' km, conversazione piena',e]],no:'Se le gambe sono pesanti, accorcia.'};
 if(t==='L')return{t,n:'Lungo '+k0+' km',km:k0,bl:[['Lungo',k0+' km a ritmo costante',pace(z.l[0])+'–'+pace(z.l[1])+'/km']],no:g.km>=21&&p>.6?'Negli ultimi 4–5 km prova il ritmo gara.':'Non guardare il cronometro.'};
 if(t==='I'){const m=p<.34?[Math.round(6+p*9),'400 m','60″']:p<.67?[Math.round(4+p*6),'800 m','90″']:[Math.round(3+p*(g.km>=21?1.5:3)),g.km>=21?'1,6 km':'1000 m','2′'];return{t,n:'Ripetute '+m[0]+'×'+m[1],km:k0,bl:[['Riscaldamento','15′ facili',e],['Ripetute',m[0]+'×'+m[1]+', recupero '+m[2]+' in trotto',pace(z.i)+'/km'],['Defaticamento','10′ facili','']],no:'Costanti, senza partire troppo forte.'}}
 const mm=Math.max(2,k0-4),rg=g.km>=21&&p>.5;return{t:'T',n:(rg?'Ritmo gara ':'Medio ')+mm+' km',km:k0,bl:[['Riscaldamento','15′ facili',e],[rg?'Ritmo gara':'Soglia',mm+' km continui',pace(rg?gp:z.t)+'/km'],['Defaticamento','10′ facili','']],no:'Ritmo controllato.'}}
function mkTpl(ds){ds=[...ds].sort((a,b)=>a-b);const L=ds.includes(6)?6:ds[ds.length-1],rest=ds.filter(x=>x!==L),pick=a=>a.length?a.reduce((m,x)=>Math.abs(x-2.5)<Math.abs(m-2.5)?x:m):null,q1=rest.length>=2?pick(rest):null;let q2=null;if(ds.length>=5&&q1!==null)q2=pick(rest.filter(x=>x!==q1&&Math.abs(x-q1)>1));return ds.map(x=>[x,x===L?'L':x===q1?'Q1':x===q2?'Q2':'E'])}
function gen(P){const s=SET(),g=G[P.g],z=zones(),gp=P.tt/g.km,N=Math.max(2,Math.min(24,Math.ceil((diff(P.start,P.date)+1)/7))),nT=g.tp.length,nb=Math.max(1,N-nT),peak=Math.min(g.cap,+s.vol*(N<=5?1:1.1)),st=+s.vol*.8,pl=Math.min(N<=5?18:99,Math.max(g.pl,Math.min(g.km>=40?32:22,Math.round(+s.vol*.3)))),sl=pl*.7,out=[];
 for(let i=0;i<N;i++){let V,L,ph,p=1;const last=i===N-1;
  if(i<nb){p=nb>1?i/(nb-1):1;V=st+(peak-st)*p;L=sl+(pl-sl)*p;const cut=(i+1)%4===0&&i<nb-1;if(cut){V*=.75;L*=.75}ph=cut?'Scarico':p<.4?'Base':p<.8?'Sviluppo':'Affinamento'}
  else{const f=g.tp[Math.min(i-nb,nT-1)];V=peak*f;L=pl*f;ph=last?'Gara':'Taper'}
  const ws=addD(P.start,i*7),tp=P.dl?mkTpl(P.dl):TPL[P.days]||TPL[4],q=tp.filter(x=>x[1][0]==='Q').length,e=Math.max(1,tp.filter(x=>x[1]==='E').length);
  L=Math.min(L,V*.5);const qk=Math.min(14,Math.max(5,V*.2)),per=Math.min(Math.max(3,(V-L-qk*q)/e),L*.9),days=[];
  for(let k=0;k<7;k++){const d=addD(ws,k),x=tp.find(y=>y[0]===k),c={z,gp,p,g};let o;
   if(P.g&&d===P.date)o=mk('G',0,c);
   else if(P.g&&d>P.date)o={t:'R',n:'Recupero dopo la gara',km:0,bl:[['Riposo','Camminata leggera e mobilità.','']],no:''};
   else if(!x)o={t:'R',n:'Riposo',km:0,bl:[['Riposo','Niente corsa. Mobilità leggera se ti va.','']],no:''};
   else if(last&&P.g)o=mk(x[1]==='E'||x[1]==='L'?'E':'W',x[1]==='L'?4:5,c);
   else{const ty=x[1]==='L'?'L':x[1]==='E'?'E':N<=4?'T':((x[1]==='Q1')===(i%2===0)?'I':'T');o=mk(ty,ty==='L'?L:ty==='E'?per:qk,c)}
   o.d=d;days.push(o)}
  out.push({i,ph,ws,days,km:days.reduce((a,b)=>a+b.km,0)})}
 return out}
function phases(w){const o=[];w.forEach(x=>{const n=x.ph==='Scarico'&&o.length?o[o.length-1].n:x.ph,l=o[o.length-1];if(l&&l.n===n){l.to=addD(x.ws,6);l.w++}else o.push({n,from:x.ws,to:addD(x.ws,6),w:1})});return o}
function prep(){const P=ls.g('P',null);PLN=P?gen(P):[];DM={};REC.forEach(r=>DM[r[0]]=recDay(r));PLN.forEach(w=>w.days.forEach(d=>DM[d.d]=d))}
function gelBlock(b){const s=SET(),z=zones(),P=ls.g('P',null),pc=b.t==='G'&&P?P.tt/b.km:(z.l[0]+z.l[1])/2,D=b.km*pc/60,gc=+s.gelC||30;if(D<75)return null;const at=[];for(let m=30;m<=D-15;m+=30)at.push(m);if(!at.length)return null;
 return['Gel: '+s.gelN,at.length+(at.length>1?' gel':' gel')+' ('+at.length*gc+' g di carboidrati): '+at.map(m=>'al minuto '+m+' (km '+(m*60/pc).toFixed(1).replace('.',',')+')').join(', ')+'. Qualche sorso d\'acqua con ciascuno.'+(b.t==='G'?' Terzo gel facoltativo al minuto 85–90 se fa caldo o senti un calo. Niente novità: usa solo gel già provati.':''),'ogni 30′']}
function carbBlock(d){const P=ls.g('P',null);if(!P||!P.g||P.g<21)return null;const k=diff(d,P.date),mx=P.g>=42?3:2;let kg=parseFloat(String(ls.g('prof',{}).kg||'').replace(',','.'));if(!kg)for(let i=0;i<30;i++){const v=parseFloat(String(ls.g('chk:'+addD(T,-i),{}).kg||'').replace(',','.'));if(v){kg=v;break}}
 if(k>=1&&k<=mx)return['Carico di carboidrati',(kg?Math.round(kg*6)+'–'+Math.round(kg*7)+' g di carboidrati nella giornata':'6–7 g di carboidrati per kg di peso nella giornata (inserisci il peso nelle Impostazioni per il totale)')+'. Riso, pasta, pane e patate, pochi grassi e fibre, bevi con regolarità. Niente cibi nuovi.','6–7 g/kg'];
 if(k===0)return['Colazione pre-gara','Circa 2,5–3 ore prima del via: '+(kg?Math.round(kg)+'–'+Math.round(kg*2)+' g di carboidrati':'1–2 g di carboidrati per kg')+' (pane o riso con marmellata, banana), pochi grassi e fibre. Solo cibi già provati.','2,5–3 h prima'];
 return null}
function dayFor(d){let b=Object.assign({},DM[d]||{d,t:'R',n:'Nessuna seduta pianificata',km:0,bl:[],no:''});const o=ls.g('ov',{})[d];
 if(o){b.n=o.n||b.n;b.km=o.km;b.no=o.no||b.no;b.bl=[[b.n,o.no||'Modificato dal coach','']];b.ch='coach'}
 else if(d>=T&&b.t!=='R'&&b.t!=='G'){const f=ls.g('fb',{});let du=0,fa=0,pa=0;for(let k=1;k<=7;k++){const x=f[addD(d,-k)];if(!x)continue;if(x.r==='duro')du++;if(x.r==='facile')fa++;if(x.r==='dolore'&&k<=3)pa++}
  if(pa){b.t='E';b.n='Facile leggero (dolore segnalato)';b.km=Math.min(6,Math.round(b.km*.6));b.bl=[['Corsa leggera',b.km+' km molto facili, stop se il dolore torna','']];b.no='Seduta alleggerita dopo il tuo feedback.';b.ch='auto'}
  else if(du||fa){const m=Math.max(.8,Math.min(1.08,1-.08*du+.04*fa));if(m!==1){b.km=Math.round(b.km*m);b.no=(b.no?b.no+' ':'')+'Adattata '+(m<1?'al ribasso':'al rialzo')+' in base al tuo feedback.';b.ch='auto'}}}
 if((b.t==='L'||b.t==='G')&&b.km>=10&&!o){const gb=gelBlock(b);if(gb)b.bl=b.bl.concat([gb])}
 if(!o){const cb=carbBlock(d);if(cb)b.bl=b.bl.concat([cb])}
 return b}
const dtype=()=>ls.g('dt:'+T,(x=>x.t==='G'||(x.t==='L'&&x.km>=14)?'lungo':['I','T','L'].includes(x.t)?'allenamento':'riposo')(dayFor(T)));
const dfl=()=>{if(!ls.g('defon',false))return[0,0,0,0];const d=Math.round(SET().rate*7700/7/10)*10;return[d,0,Math.round(d/4),0]};
const tgt=()=>{const b=ls.g('tg',{})[dtype()]||TD[dtype()],f=dfl();return b.map((x,i)=>Math.max(0,x-f[i]))};
const log=()=>ls.g('log:'+T,[]);
const tot=()=>log().reduce((a,x)=>[a[0]+x.kcal,a[1]+x.p,a[2]+x.c,a[3]+x.g],[0,0,0,0]);
function ring(l,v,t,u,c){const R=34,C=2*Math.PI*R,f=Math.min(1,t?v/t:0);return`<div class="rg"><svg viewBox="0 0 80 80" width="74" height="74" role="img" aria-label="${l} ${Math.round(v)} su ${t}"><circle cx="40" cy="40" r="${R}" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="40" cy="40" r="${R}" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${f*C} ${C}" transform="rotate(-90 40 40)"/><text x="40" y="45" text-anchor="middle" font-size="16" font-weight="700" fill="currentColor">${Math.round(v)}</text></svg><b>${l}</b><span>/ ${t}${u}</span></div>`}
function rings(){const a=tot(),t=tgt();return`<div class="rings">${ring('Calorie',a[0],t[0],'','var(--warn)')}${ring('Proteine',a[1],t[1],' g','var(--blue)')}${ring('Carbo',a[2],t[2],' g','#E0B020')}${ring('Grassi',a[3],t[3],' g','var(--ok)')}</div>`}

const supTxt=()=>{const s=SET();return s.supN+': '+s.supP+' g proteine, '+s.supK+' kcal, '+s.supC+' g carboidrati, '+s.supG+' g grassi per dose'};
function vSup(){const s=SET();return`<div class="card"><b>Proteine in polvere</b><p class="mut">${s.supN}: ${s.supP} g di proteine e ${s.supK} kcal per dose. Una dose aggiunta conta nei totali di oggi.</p><button class="btn alt" data-a="addsup" style="width:100%">Aggiungi 1 dose a oggi</button><button class="btn alt" data-a="addgel" style="width:100%;margin-top:8px">Aggiungi 1 gel (${s.gelC} g di carboidrati)</button></div>`}
function vWt(){const s=SET();const w=[];for(let k=0;k<30;k++){const d=addD(T,-k),v=parseFloat(String(ls.g('chk:'+d,{}).kg??'').replace(',','.'));if(v)w.push([d,v])}
 const dfc=Math.round(s.rate*7700/7/10)*10,on=ls.g('defon',false);
 return`<h2 style="margin-top:8px">Perdere peso</h2><div class="card"><p class="mut">${w[0]?'Ultimo peso '+String(w[0][1]).replace('.',',')+' kg ('+fd(w[0][0]).slice(4)+')':'Registra il peso nella scheda Oggi.'}${s.kgT?' · obiettivo '+s.kgT+' kg':''}</p><p>Con ${String(s.rate).replace('.',',')} kg a settimana serve un deficit di circa <b>${dfc} kcal al giorno</b> (stima).</p><button class="btn${on?'':' alt'}" data-a="defon" style="width:100%">${on?'Deficit attivo, tocca per toglierlo':'Applica il deficit agli obiettivi'}</button><p class="mut">Obiettivo e ritmo si cambiano nelle Impostazioni.${w.length>1?' Ultime pesate: '+w.slice(0,5).map(x=>String(x[1]).replace('.',',')).join(' · ')+'.':''}</p></div>`}
function vPianoT(){const b=[['cal','Calendario'],['plan','Piano'],['nut','Nutrizione']];return`<div class="seg">${b.map(x=>`<button data-a="sub" data-v="${x[0]}" aria-pressed="${sub===x[0]}">${x[1]}</button>`).join('')}</div>`+(sub==='cal'?vCal():sub==='plan'?vPlan():vWt()+vSup()+vNut()+vDoc())}
function vChat(){const c=ls.g('chat',[]);return`<h2 style="margin-top:8px">Allenatore</h2><div id="chat">${c.length?c.map(m=>`<div class="msg ${m.r}">${md(m.t)}</div>`).join(''):'<p class="mut">Racconta al coach come ti sei sentito o cosa vuoi cambiare. Può modificare gli allenamenti dei prossimi giorni.</p>'}${busy==='ch'?'<div class="msg a">…</div>':''}</div><div class="chips">${["Oggi non sono uscito","Mi sento stanco","Ho un fastidio","Com'è andata la settimana?","Aiutami a perdere peso"].map(q=>`<button class="btn alt" data-a="chip" style="min-height:40px;white-space:nowrap">${q}</button>`).join('')}</div><textarea id="cm" placeholder="Scrivi al coach…" style="width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px"></textarea><button class="btn" data-a="send" style="width:100%;margin-top:8px" ${busy?'disabled':''}>Invia</button><div class="err" id="m4"></div>`}
function ctx(){const s=SET(),P=ls.g('P',null),f=ls.g('fb',{}),A=ls.g('act',[]).slice(0,4).map(x=>x.d+' '+x.km.toFixed(1)+' km '+hms(x.t)+' passo '+pace(x.t/x.km)+' FC '+(Math.round(x.hr)||'n.d.')),nx=[],wt=[];
 for(let k=0;k<7;k++){const d=addD(T,k),x=dayFor(d);nx.push(d+' '+x.n+(x.km?' ('+Math.round(x.km)+' km)':''))}
 for(let k=0;k<14;k++){const d=addD(T,-k),v=ls.g('chk:'+d,{}).kg;if(v)wt.push(d+' '+v+' kg')}
 const a=tot(),t=tgt(),z=zones(),c=ls.g('chk:'+T,{});
 return`Oggi ${T}. Obiettivo: ${P?G[P.g].n+' il '+P.date+' in '+hms(P.tt):'nessuno, fase di recupero'}. Ritmi min/km: facile ${pace(z.e[0])}-${pace(z.e[1])}, soglia ${pace(z.t)}, ripetute ${pace(z.i)}. Prossimi 7 giorni: ${nx.join('; ')}. Feedback recenti: ${Object.keys(f).sort().slice(-7).map(d=>d+' '+f[d].r).join('; ')||'nessuno'}. Ultime corse: ${A.join('; ')||'nessuna'}. Check-in oggi: sonno ${c.sleep||'n.d.'} h, FC riposo ${c.hr||'n.d.'}, HRV ${c.hrv||'n.d.'}. Pesi: ${wt.join('; ')||'nessuno'}${s.kgT?'; peso obiettivo '+s.kgT+' kg':''}. Integratore proteico: ${supTxt()}. Gel in corsa: ${SET().gelN}, ${SET().gelC} g di carboidrati ciascuno. Nutrizione oggi: ${Math.round(a[0])}/${t[0]} kcal, P ${Math.round(a[1])}/${t[1]}, C ${Math.round(a[2])}/${t[2]}, G ${Math.round(a[3])}/${t[3]}.`}
async function send(txt){txt=(txt||($('cm')?$('cm').value:'')).trim();if(!txt)return;const S=await ai();if(!S)return fail('m4');const c=ls.g('chat',[]);c.push({r:'u',t:txt});ls.s('chat',c.slice(-40));busy='ch';render();const st=SET(),hist=c.slice(-8,-1).map(m=>(m.r==='u'?'Utente: ':'Coach: ')+m.t).join('\n');

 c.push({r:'a',t:String(r.risposta||'')+(ms.length?'\n\n**Ho aggiornato il piano:** '+ms.map(x=>fd(x.data)+' ('+x.titolo+')').join(', ')+'.':'')});ls.s('chat',c.slice(-40));busy='';render()}catch(e){busy='';render();fail('m4',e)}}
function csv(t){const r=[];let row=[],c='',q=0;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h==='"'&&t[i+1]==='"'){c+='"';i++}else if(h==='"')q=0;else c+=h}else if(h==='"')q=1;else if(h===','){row.push(c);c=''}else if(h==='\n'||h==='\r'){if(h==='\r'&&t[i+1]==='\n')i++;row.push(c);c='';if(row.some(x=>x))r.push(row);row=[]}else c+=h}if(c||row.length){row.push(c);r.push(row)}return r}
function parseAct(txt,name){const r=csv(txt.replace(/^\uFEFF/,'')),h=r[0].map(x=>x.trim().toLowerCase()),ix=f=>h.findIndex(f),iL=ix(x=>x==='lap'),iT=ix(x=>x==='tempo'),iD=ix(x=>x.startsWith('distanza')),iP=ix(x=>x.startsWith('passo medio')&&!x.includes('movimento')),iH=ix(x=>x.startsWith('fc media')),iM=ix(x=>x.startsWith('fc max')),num=s=>parseFloat(String(s).replace(',','.'))||0,rows=r.slice(1),sm=rows.find(x=>/^(--|riepilogo)$/i.test((x[iL]||'').trim()));if(!sm||iD<0)return null;
 const laps=rows.filter(x=>/^\d+$/.test((x[iL]||'').trim())&&num(x[iD])>.9).map(x=>({n:+x[iL],p:pt(x[iP]),h:num(x[iH])})),m=name.match(/(\d{4})_(\d\d)_(\d\d)/);return{d:m?m[1]+'-'+m[2]+'-'+m[3]:T,km:num(sm[iD]),t:pt(sm[iT]),hr:num(sm[iH]),hm:num(sm[iM]),laps}}
async function imp(files){let a=ls.g('act',[]),n=0;for(const f of files){try{const r=parseAct(await f.text(),f.name);if(r&&r.km>0&&r.t>0){a=a.filter(x=>!(x.d===r.d&&Math.abs(x.km-r.km)<.05&&x.t===r.t));a.push(r);n++}}catch(e){}}a.sort((x,y)=>x.d<y.d?1:x.d>y.d?-1:0);ls.s('act',a.slice(0,60));render();const m=$('m5');if(m){m.textContent=n?n+' attività importate.':'Nessun file riconosciuto: esporta in CSV da Garmin Connect.';if(n)m.style.color='var(--mut)'}}

 const fp=(k,l)=>`<label class="fld"><span>${l}</span><input data-p="${k}" inputmode="decimal" value="${p[k]??''}"></label>`,fs=(k,l)=>`<label class="fld"><span>${l}</span><input data-s="${k}" inputmode="decimal" value="${s[k]}"></label>`,sl=(k,l,o)=>`<label class="fld"><span>${l}</span><select data-s="${k}">${o.map(x=>`<option value="${Array.isArray(x)?x[0]:x}"${String(Array.isArray(x)?x[0]:x)===String(s[k])?' selected':''}>${Array.isArray(x)?x[1]:x}</option>`).join('')}</select></label>`;
